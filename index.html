<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Heart 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=DM+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="petals" id="petals"></div>

<div id="login-page" class="page active">
  <div class="login-card">
    <div class="lock-icon" style="font-size: 3rem; margin-bottom: 10px;">💖</div>
    <h1 class="login-title">My Heart</h1>
    <p class="login-sub">Only you can enter here</p>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Who are you?" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Your birthday (DD/MM/YYYY) ✨" />
    </div>

    <p id="error-msg" style="color: #ff4d4d; font-size: 14px; margin-bottom: 10px; min-height: 20px;"></p>
    <button class="login-btn" onclick="handleLogin()">Enter 💕</button>
  </div>
</div>

<div id="proposal-page" class="page">
  <div class="card">
    <h1 class="title">
      Will you be my girlfriend?<br>
      <span id="display-name"></span> 💕
    </h1>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yes 💖</button>
      <button class="no" id="noBtn">No 🙈</button>
    </div>

    <p class="message" id="response-text"></p>
    <button class="back" onclick="handleLogout()">← Back</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
